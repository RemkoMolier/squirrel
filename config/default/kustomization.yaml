apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default kustomize root: deploys the operator in self-signed cert
# mode (the design's default). Apply with:
#
#   kubectl apply -k config/default
#
# Switch to cert-manager mode by applying the overlay in
# config/overlays/cert-manager instead.

resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../webhook

# Patch the controller-gen-emitted MWC into its deployable shape:
# the design name, the real Service coordinates, and the
# namespaceSelector that gates which namespaces fire the webhook.
patches:
  - target:
      group: admissionregistration.k8s.io
      version: v1
      kind: MutatingWebhookConfiguration
      name: mutating-webhook-configuration
    path: mwc_patch.yaml
