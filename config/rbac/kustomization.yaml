apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The ClusterRole is generated by controller-gen from the
# +kubebuilder:rbac markers throughout the codebase. The binding
# is hand-written - it has no controller-gen marker because the
# ServiceAccount it references is declared in config/manager.

resources:
  - role.yaml
  - role_binding.yaml
