apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Manager scaffolding: Namespace, ServiceAccount, Deployment, Service.
# Consumed by the kustomize roots in config/default (self-signed) and
# config/overlays/cert-manager (cert-manager mode). The
# ClusterRoleBinding lives under config/rbac because it ties the
# generated ClusterRole to the ServiceAccount declared here.

resources:
  - namespace.yaml
  - service_account.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
