    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterImagePolicy is a cluster-scoped policy that rewrites or skips
          container images at Pod admission time according to its rules.

          See docs/design/v1alpha1.md for the full semantics, including the
          `squirrel.molier.dev/enabled` namespace opt-in gate and the two-phase
          (skip-then-rewrite) resolution model.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired state of this ClusterImagePolicy.
            properties:
              defaultAction:
                description: |-
                  DefaultAction is the action applied to rules that omit their own
                  Action. Defaults to "rewrite" when unset.
                enum:
                - rewrite
                - skip
                type: string
              defaultTarget:
                description: |-
                  DefaultTarget is the rewrite target merged under any rule-level
                  target. The effective merged target (rule over default,
                  field-by-field) must end up with a Registry.
                properties:
                  registry:
                    description: |-
                      Registry is the target-registry template (literal or `{placeholder}`).
                      Required in the *effective* merged target: either Rule.Target.Registry
                      or Spec.DefaultTarget.Registry must be set.
                    type: string
                  repository:
                    description: |-
                      Repository is the target-repository template.
                      Defaults to "{repository}" (passthrough) when neither Rule.Target
                      nor Spec.DefaultTarget supplies one.
                    type: string
                  tag:
                    description: |-
                      Tag is sugar for a single-entry Tags list. The reconciler folds it
                      into Tags via EffectiveTags() and rejects rules that set both Tag
                      and Tags simultaneously.

                      Mutually exclusive with Tags. MaxLength=256 caps the field for the
                      CEL cost estimator; OCI tags are 128 chars max and tag templates
                      add a small placeholder budget, so 256 is comfortably wide.
                    maxLength: 256
                    type: string
                  tags:
                    description: |-
                      Tags is the ordered list of tag templates. At admission time the
                      rewrite action uses the first template that renders to a non-empty
                      OCI-valid tag; remaining entries are reserved for future actions
                      (see internal/imageref.SelectTag).

                      Mutually exclusive with Tag. MaxItems=16 caps the array for the
                      CEL cost estimator; in practice a tag fallback chain longer than
                      a handful of entries indicates a misuse of the feature.
                    items:
                      type: string
                    maxItems: 16
                    type: array
                type: object
                x-kubernetes-validations:
                - message: target.tag and target.tags are mutually exclusive
                  rule: '!(has(self.tag) && size(self.tag) > 0 && has(self.tags) &&
                    size(self.tags) > 0)'
              namespaceSelector:
                description: |-
                  NamespaceSelector narrows the set of opted-in namespaces this
                  policy applies to. Nil or empty applies to every namespace that
                  carries the operator-wide `squirrel.molier.dev/enabled=true`
                  label; the MutatingWebhookConfiguration is the safety gate.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              rules:
                description: |-
                  Rules is the ordered list of rules. The list must have at least
                  one entry; the reconciler marks empty rule lists as
                  `Accepted=False` with reason `EmptyRules`. The MaxItems=128 cap
                  is set to keep the CRD's CEL cost estimator within K8s 1.33+'s
                  budget for per-rule XValidation (see api/v1alpha1/target.go).
                  In practice a policy with more than a few rules indicates a
                  structural design problem; 128 is generous.
                items:
                  description: |-
                    Rule is one entry in a policy's rules list.

                    Resolution semantics are documented in docs/design/v1alpha1.md and
                    implemented in internal/engine. Briefly:

                      - A skip rule whose Match matches an image terminates resolution
                        for that container.

                      - Otherwise, rewrite rules are sorted by effective priority (the
                        Priority override if set, else the match-glob's specificity score
                        from internal/imageref) and the first one whose Match matches
                        wins for that container.
                  properties:
                    action:
                      description: |-
                        Action is the action to take when this rule matches. Optional;
                        inherits Spec.DefaultAction (which defaults to "rewrite") when
                        unset.
                      enum:
                      - rewrite
                      - skip
                      type: string
                    match:
                      description: |-
                        Match is the match expression for this rule, stored as raw JSON.
                        Either a glob string (`"docker.io/**:*"`) or a structured object
                        with the per-field globs from the Match type. Callers parse the
                        payload via Rule.MatchExpression().

                        Why raw JSON: the CRD schema for this field is schemaless to
                        accommodate the string-or-object union (the API server has no way
                        to validate a structural shape across both types). Storing the
                        field as apiextensionsv1.JSON means the Go decoder never fails on
                        a malformed payload, which is essential - if the decoder errored,
                        a bad policy would poison every typed informer's list/watch and
                        the reconciler could not even read it to set Accepted=False with
                        reason InvalidMatch. With raw JSON the policy lands in etcd, the
                        informer hands it to the reconciler, and the reconciler surfaces
                        the parse error through status conditions as designed.

                        We deliberately do *not* attach a +kubebuilder:validation:XValidation
                        CEL rule to this field. Kubernetes static CRD validation refuses to
                        construct CEL type information for rules under a field that has no
                        OpenAPI type (the Schemaless + XPreserveUnknownFields pairing) and
                        the apiextensions validator rejects the CRD itself before resource
                        admission. All match-shape validation happens in
                        MatchExpression() and is surfaced via the Accepted=False /
                        InvalidMatch condition instead.
                      x-kubernetes-preserve-unknown-fields: true
                    priority:
                      description: |-
                        Priority overrides the default specificity-based priority of this
                        rule. Higher values win. The default (when Priority is nil) is the
                        byte length of the match-glob's normalised form, so longer, more
                        literal globs naturally apply first. Skip rules ignore this field
                        because they run unconditionally before any rewrite rule.
                      format: int32
                      type: integer
                    target:
                      description: |-
                        Target is the rewrite target for this rule. Meaningful only when
                        the effective action is "rewrite"; merged field-by-field over
                        Spec.DefaultTarget. The reconciler rejects rules that set Target
                        on an effective-skip action.
                      properties:
                        registry:
                          description: |-
                            Registry is the target-registry template (literal or `{placeholder}`).
                            Required in the *effective* merged target: either Rule.Target.Registry
                            or Spec.DefaultTarget.Registry must be set.
                          type: string
                        repository:
                          description: |-
                            Repository is the target-repository template.
                            Defaults to "{repository}" (passthrough) when neither Rule.Target
                            nor Spec.DefaultTarget supplies one.
                          type: string
                        tag:
                          description: |-
                            Tag is sugar for a single-entry Tags list. The reconciler folds it
                            into Tags via EffectiveTags() and rejects rules that set both Tag
                            and Tags simultaneously.

                            Mutually exclusive with Tags. MaxLength=256 caps the field for the
                            CEL cost estimator; OCI tags are 128 chars max and tag templates
                            add a small placeholder budget, so 256 is comfortably wide.
                          maxLength: 256
                          type: string
                        tags:
                          description: |-
                            Tags is the ordered list of tag templates. At admission time the
                            rewrite action uses the first template that renders to a non-empty
                            OCI-valid tag; remaining entries are reserved for future actions
                            (see internal/imageref.SelectTag).

                            Mutually exclusive with Tag. MaxItems=16 caps the array for the
                            CEL cost estimator; in practice a tag fallback chain longer than
                            a handful of entries indicates a misuse of the feature.
                          items:
                            type: string
                          maxItems: 16
                          type: array
                      type: object
                      x-kubernetes-validations:
                      - message: target.tag and target.tags are mutually exclusive
                        rule: '!(has(self.tag) && size(self.tag) > 0 && has(self.tags)
                          && size(self.tags) > 0)'
                  required:
                  - match
                  type: object
                maxItems: 128
                minItems: 1
                type: array
            required:
            - rules
            type: object
          status:
            description: Status carries the most recent observation from the reconciler.
            properties:
              conditions:
                description: |-
                  Conditions report the reconciler's evaluation of the policy. Today
                  the only condition type is "Accepted"; reasons follow the
                  Reason* constants defined in this package.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation the reconciler has
                  finished evaluating. Consumers compare this to metadata.generation
                  to determine whether the conditions reflect the latest spec.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
