apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The MutatingWebhookConfiguration generated by controller-gen.
# The default kustomize root (config/default) patches it to:
#
#   - rename the placeholder clientConfig.service (webhook-service in
#     `system` namespace) to the real squirrel-webhook Service in
#     squirrel-system,
#   - add the design's namespaceSelector (opt-in label plus
#     system-namespace exclusion).
#
# The cert-manager overlay adds a cert-manager.io/inject-ca-from
# annotation on top so cert-manager populates caBundle.

resources:
  - manifests.yaml
